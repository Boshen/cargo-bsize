# Assembly mnemonics matched by the assembly analyzer, not typos.
[default.extend-identifiers]
calll = "calll"
jmpq = "jmpq"
retq = "retq"

# Generated reports contain dependency names and arbitrary strings extracted
# from the analyzed binary, including values abbreviated in the middle.
[files]
extend-exclude = ["rolldown-napi-bsize.md"]

# `ser` is serde's serialization module, not a misspelling of `set`.
[default.extend-words]
ser = "ser"
# `.rela.dyn` is the ELF section of relocations with addends, not "real".
rela = "rela"

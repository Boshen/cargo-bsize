# `dup` resolves to four versions, only two of which link:
#
#   1.0.0  dependency of `a`            reported
#   2.0.0  dependency of `b`            reported
#   3.0.0  dev-dependency of `app`      skipped
#   4.0.0  dependency of `pm`           skipped, `pm` is a proc-macro
#
# `dup-*` and `pm` are excluded so they are reachable only through the members.

[workspace]
members = ["a", "app", "b"]
exclude = ["dup-1", "dup-2", "dup-3", "dup-4", "pm"]
resolver = "2"
